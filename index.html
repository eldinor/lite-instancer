<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive examples for @litools/instancer and Babylon Lite." />
    <title>@litools/instancer examples</title>
  </head>
  <body>
    <main class="catalog-shell">
      <header class="catalog-hero">
        <div>
          <p class="catalog-kicker">Babylon Lite &middot; stable IDs &middot; GPU-scale crowds</p>
          <h1>Instancer <span>examples</span></h1>
          <p class="catalog-intro">Explore thin instances, hierarchy pools, VAT animation, attachments, picking, outlines, and production-scale crowd workflows.</p>
        </div>
        <nav class="catalog-links" aria-label="Project links">
          <a href="https://github.com/eldinor/lite-instancer" target="_blank" rel="noreferrer">GitHub</a>
          <a href="https://babylonpress.org/" target="_blank" rel="noreferrer">BabylonPress</a>
        </nav>
      </header>

      <div class="catalog-toolbar">
        <input class="catalog-search" type="search" placeholder="Search examples..." aria-label="Search examples" data-search />
        <div class="catalog-filters" role="group" aria-label="Filter examples by category" data-filters></div>
        <output class="catalog-count" aria-live="polite" data-result-count></output>
      </div>

      <div data-catalog></div>
    </main>
    <script type="module" src="/examples/shared/catalog-app.ts"></script>
  </body>
</html>
